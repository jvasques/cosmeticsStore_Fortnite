version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: fortnite_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fortnite3
      POSTGRES_USER: fortnite
      POSTGRES_PASSWORD: fortnite
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fortnite_backend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      PORT: 3000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: fortnite3
      POSTGRES_USER: fortnite
      POSTGRES_PASSWORD: fortnite
      SYNC_CRON_SCHEDULE: "40 23 * * *"
      SYNC_CRON_TZ: "America/Sao_Paulo"
    ports:
      - "3000:3000"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://192.168.15.200:3000}
    container_name: fortnite_frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    ports:
      - "4173:80"

volumes:
  postgres_data: